<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="simk-full-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="simk-full-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <filter id="simk-full-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ICON (44x44 centered at x=24, y=24) -->
  <g transform="translate(2, 2) scale(0.6875)">
    <!-- Perisai Ramah & Higienis -->
    <path d="M 32 3 C 20 3, 7 13, 7 28 C 7 43.5, 20.5 54.5, 32 61 C 43.5 54.5, 57 43.5, 57 28 C 57 13, 44 3, 32 3 Z"
          fill="url(#simk-full-grad)"
          filter="url(#simk-full-shadow)" />

    <!-- Sirkuit Sistem -->
    <path d="M 12 28 Q 18 16 32 16 Q 46 16 52 28" stroke="url(#simk-full-accent)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 16 40 Q 24 50 32 53 Q 40 50 48 40" stroke="url(#simk-full-accent)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="12" cy="28" r="2.8" fill="#5eead4" />
    <circle cx="52" cy="28" r="2.8" fill="#5eead4" />
    <circle cx="32" cy="16" r="2.5" fill="#ffffff" />
    <circle cx="32" cy="53" r="2.5" fill="#ffffff" />

    <!-- Palang Higienis Medis -->
    <rect x="27.5" y="21" width="9" height="24" rx="4.5" fill="#ffffff" />
    <rect x="20" y="28.5" width="24" height="9" rx="4.5" fill="#ffffff" />
    <circle cx="32" cy="33" r="2.2" fill="#0d9488" />

    <!-- Senyum Ramah & Kilau -->
    <path d="M 26 42 Q 32 46.5 38 42" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 45 10 L 46.5 13.5 L 50 15 L 46.5 16.5 L 45 20 L 43.5 16.5 L 40 15 L 43.5 13.5 Z" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <g transform="translate(56, 0)">
    <text x="0" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="20" fill="#0f172a" letter-spacing="-0.5">
      SIM<tspan fill="#0d9488">KLINIK</tspan>
    </text>
    <rect x="108" y="9" width="68" height="17" rx="4" fill="#ccfbf1" />
    <text x="114" y="21.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#0f766e" letter-spacing="0.8">
      PURWOREJO
    </text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748b" letter-spacing="0.2">
      Sistem Faskes Ramah &amp; Terpadu
    </text>
  </g>
</svg>
