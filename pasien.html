<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard Pasien - Sistem Informasi Manajemen Klinik (SIMKLINIK)" />
    <title>Dashboard Pasien — SIMKLINIK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M19 10.5h-5.5V5a1.5 1.5 0 0 0-3 0v5.5H5a1.5 1.5 0 0 0 0 3h5.5V19a1.5 1.5 0 0 0 3 0v-5.5H19a1.5 1.5 0 0 0 0-3z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/role-pages.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
  </head>
  <body data-role="pasien">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </span>
          <span><strong>SIMKLINIK</strong><small>Manajemen Klinik</small></span>
        </div>
        <div class="sidebar-label">Menu pasien</div>
        <nav class="main-nav" id="mainNav"></nav>
        <div class="sidebar-footer">
          <div class="help-box">
            <span class="help-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </span>
            <div>
              <strong>Butuh bantuan?</strong><small>Hubungi administrator</small>
            </div>
          </div>
          <button class="logout-button" id="logoutButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Keluar
          </button>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="breadcrumb">
            <span>SIMKLINIK</span><b>/</b><strong>Pasien</strong>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="Notifikasi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-menu">
              <div class="avatar" id="headerAvatar"></div>
              <div>
                <strong id="headerName"></strong><small id="headerRole"></small>
              </div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" class="chevron"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </header>
        <div class="content-wrap">
          <section class="welcome-row">
            <div>
              <p class="eyebrow" id="dateLabel"></p>
              <h1 id="welcomeTitle"></h1>
              <p class="welcome-copy" id="welcomeCopy"></p>
            </div>
            <button class="primary-button" id="primaryAction">
              <span id="primaryActionText"></span>
            </button>
          </section>
          <section class="stats-grid" id="statsGrid"></section>
          <section class="dashboard-grid">
            <div class="panel schedule-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">AGENDA</p>
                  <h2 id="agendaTitle"></h2>
                </div>
                <button class="text-button">Lihat semua <span>&rarr;</span></button>
              </div>
              <div class="schedule-list" id="scheduleList"></div>
            </div>
            <div class="panel insight-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">RINGKASAN</p>
                  <h2 id="insightTitle"></h2>
                </div>
                <span class="live-badge"><i></i> Live</span>
              </div>
              <div id="insightContent"></div>
            </div>
          </section>
          <section class="panel lower-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">DATA</p>
                <h2 id="lowerTitle">Ringkasan</h2>
              </div>
              <button class="text-button">Buka daftar <span>&rarr;</span></button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr id="tableHead"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="assets/js/dashboard/role-dashboard.js"></script>
  </body>
</html>
