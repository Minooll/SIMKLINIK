<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard Pasien - Sistem Informasi Manajemen Klinik (SIMKLINIK)" />
    <title>Dashboard Pasien — SIMKLINIK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M19 10.5h-5.5V5a1.5 1.5 0 0 0-3 0v5.5H5a1.5 1.5 0 0 0 0 3h5.5V19a1.5 1.5 0 0 0 3 0v-5.5H19a1.5 1.5 0 0 0 0-3z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/role-pages.css" />
    <link rel="stylesheet" href="assets/css/modal.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config/supabase.js"></script>
  </head>
  <body data-role="pasien">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </span>
          <span><strong>SIMKLINIK</strong><small>Manajemen Klinik</small></span>
        </div>
        <div class="sidebar-label">Menu pasien</div>
        <nav class="main-nav" id="mainNav"></nav>
        <div class="sidebar-footer">
          <div class="help-box">
            <span class="help-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </span>
            <div>
              <strong>Butuh bantuan?</strong><small>Hubungi administrator</small>
            </div>
          </div>
          <button class="logout-button" id="logoutButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Keluar
          </button>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="breadcrumb">
            <span>SIMKLINIK</span><b>/</b><strong>Pasien</strong>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="Notifikasi">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
            <div class="profile-menu">
              <div class="avatar" id="headerAvatar"></div>
              <div>
                <strong id="headerName"></strong><small id="headerRole"></small>
              </div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" class="chevron"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </header>
        <div class="content-wrap">
          <section class="welcome-row">
            <div>
              <p class="eyebrow" id="dateLabel"></p>
              <h1 id="welcomeTitle"></h1>
              <p class="welcome-copy" id="welcomeCopy"></p>
            </div>
            <div class="welcome-actions">
              <button class="secondary-button" id="btnOpenHealthProfile" data-modal-target="modalHealthProfile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span>Profil Medis</span>
              </button>
              <button class="primary-button" id="primaryAction" data-modal-target="modalBooking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span id="primaryActionText">Buat Janji</span>
              </button>
            </div>
          </section>
          <section class="stats-grid" id="statsGrid"></section>
          <section class="dashboard-grid">
            <div class="panel schedule-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">AGENDA</p>
                  <h2 id="agendaTitle"></h2>
                </div>
                <button class="text-button" id="btnViewAllAgenda">Lihat semua <span>&rarr;</span></button>
              </div>
              <div class="schedule-list" id="scheduleList"></div>
            </div>
            <div class="panel insight-panel">
              <div class="panel-heading">
                <div>
                  <p class="eyebrow">RINGKASAN</p>
                  <h2 id="insightTitle"></h2>
                </div>
                <span class="live-badge"><i></i> Live</span>
              </div>
              <div id="insightContent"></div>
            </div>
          </section>
          <section class="panel lower-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">DATA</p>
                <h2 id="lowerTitle">Ringkasan</h2>
              </div>
              <button class="text-button" id="btnViewAllLower">Buka daftar <span>&rarr;</span></button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr id="tableHead"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         MODAL 1: BUAT JANJI TEMU (BOOKING)
         ══════════════════════════════════════════════════════════ -->
    <div class="modal-backdrop" id="modalBooking" role="dialog" aria-modal="true" aria-labelledby="modalBookingTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title" id="modalBookingTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Buat Janji Temu Dokter
          </h3>
          <button class="modal-close-btn" data-modal-close aria-label="Tutup modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <form id="formBooking" novalidate>
          <div class="modal-body">
            <div class="modal-form-group">
              <label for="bookingServiceSelect">Poli Layanan Medis</label>
              <select id="bookingServiceSelect" required>
                <option value="">-- Memuat Layanan Poliklinik... --</option>
              </select>
            </div>
            <div class="modal-form-group">
              <label for="bookingDoctorSelect">Dokter Spesialis / Pemeriksa</label>
              <select id="bookingDoctorSelect" required disabled>
                <option value="">-- Pilih Poli Terlebih Dahulu --</option>
              </select>
            </div>
            <div class="modal-grid-2">
              <div class="modal-form-group">
                <label for="bookingDateInput">Tanggal Kunjungan</label>
                <input type="date" id="bookingDateInput" required />
              </div>
              <div class="modal-form-group">
                <label for="bookingTimeSelect">Jam Sesi Konsultasi</label>
                <select id="bookingTimeSelect" required>
                  <option value="08:30:00">08:30 WIB (Pagi)</option>
                  <option value="09:30:00">09:30 WIB (Pagi)</option>
                  <option value="10:30:00">10:30 WIB (Pagi)</option>
                  <option value="13:30:00">13:30 WIB (Siang)</option>
                  <option value="14:30:00">14:30 WIB (Siang)</option>
                </select>
              </div>
            </div>
            <div class="modal-info-box" id="bookingQuotaNotice">
              Silakan tentukan poli, dokter, dan tanggal untuk cek ketersediaan kuota.
            </div>
            <div class="modal-form-group">
              <label for="bookingComplaint">Keluhan Utama / Alasan Kunjungan</label>
              <textarea id="bookingComplaint" rows="3" placeholder="Contoh: Demam sejak 2 hari yang lalu disertai batuk kering dan sakit tenggorokan." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-modal-cancel" data-modal-close>Batal</button>
            <button type="submit" class="btn-modal-submit" id="btnSubmitBooking">
              <span class="btn-spinner"></span>
              <span>Konfirmasi Janji Temu</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         MODAL 2: DETAIL REKAM MEDIS (RME)
         ══════════════════════════════════════════════════════════ -->
    <div class="modal-backdrop" id="modalMedicalDetail" role="dialog" aria-modal="true" aria-labelledby="modalMedicalDetailTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-header">
          <h3 class="modal-title" id="modalMedicalDetailTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Detail Rekam Medis Elektronik (RME)
          </h3>
          <button class="modal-close-btn" data-modal-close aria-label="Tutup modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="modal-body" id="modalMedicalDetailBody">
          <!-- Populated by JavaScript -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-modal-cancel" data-modal-close>Tutup</button>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         MODAL 3: PROFIL KESEHATAN MANDIRI
         ══════════════════════════════════════════════════════════ -->
    <div class="modal-backdrop" id="modalHealthProfile" role="dialog" aria-modal="true" aria-labelledby="modalHealthProfileTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title" id="modalHealthProfileTitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            Profil Kesehatan Pasien
          </h3>
          <button class="modal-close-btn" data-modal-close aria-label="Tutup modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <form id="formHealthProfile" novalidate>
          <div class="modal-body">
            <div class="modal-grid-2">
              <div class="modal-form-group">
                <label for="healthBloodType">Golongan Darah</label>
                <select id="healthBloodType">
                  <option value="">-- Pilih --</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="AB">AB</option>
                  <option value="O">O</option>
                </select>
              </div>
              <div class="modal-form-group">
                <label for="healthAllergies">Riwayat Alergi (Obat / Makanan)</label>
                <input type="text" id="healthAllergies" placeholder="Contoh: Amoxicillin, Paracetamol" />
              </div>
            </div>
            <div class="modal-form-group">
              <label for="healthEmergencyContact">Nama Kontak Darurat</label>
              <input type="text" id="healthEmergencyContact" placeholder="Nama kerabat / keluarga" required />
            </div>
            <div class="modal-form-group">
              <label for="healthEmergencyPhone">Nomor Telepon Kontak Darurat</label>
              <input type="tel" id="healthEmergencyPhone" placeholder="08xxxxxxxxxx" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-modal-cancel" data-modal-close>Batal</button>
            <button type="submit" class="btn-modal-submit" id="btnSubmitHealthProfile">
              <span class="btn-spinner"></span>
              <span>Simpan Pembaruan</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- UI Components & Supabase Data Services -->
    <script src="assets/js/components/modal.js"></script>
    <script src="assets/js/components/toast.js"></script>
    <script src="assets/js/services/patientService.js"></script>
    <script src="assets/js/services/appointmentService.js"></script>
    <script src="assets/js/services/queueService.js"></script>
    <script src="assets/js/services/medicalRecordService.js"></script>
    <script src="assets/js/services/prescriptionService.js"></script>
    <script src="assets/js/dashboard/role-dashboard.js"></script>
  </body>
</html>
